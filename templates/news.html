<!DOCTYPE html>
<html lang="en" class="dark">
<head><script>
    (function() {
        const savedTheme = localStorage.getItem('mq_theme') || 'dark';
        const savedAccent = localStorage.getItem('mq_accent') || '#38bdf8';
        
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.style.setProperty('--accent-color', savedAccent);
        
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(savedAccent);
        if (result) {
            const r = parseInt(result[1], 16), g = parseInt(result[2], 16), b = parseInt(result[3], 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            document.documentElement.style.setProperty('--accent-text', yiq >= 128 ? '#020617' : '#ffffff');
        }
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyQuest.AI - Market News</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen flex flex-col md:flex-row bg-slate-950 text-slate-100 overflow-x-hidden">

    <!-- Sidebar Mounting Point -->
    <div id="sidebar-container"></div>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full space-y-6 max-w-7xl mx-auto">
        
        <!-- Header -->
        <div class="flex flex-col gap-4 md:flex-row md:justify-between md:items-center border-b border-white/10 pb-4">
            <div>
                <h1 class="text-xl md:text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    📰 Real-Time Market News
                </h1>
                <p class="text-slate-400 text-xs mt-0.5">Live market headlines powered by Yahoo Finance API</p>
            </div>
            <button onclick="fetchNews()" class="liquid-btn-primary px-3 py-1.5 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 w-full md:w-auto justify-center">
                🔄 Refresh News
            </button>
        </div>

        <!-- News Feed Container -->
        <div id="news-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Loading skeleton rendered dynamically -->
        </div>

    </main>

    <script src="/static/sidebar.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            fetchNews();
        });

        async function fetchNews() {
            const container = document.getElementById('news-container');
            
            // Render Skeleton Loader
            container.innerHTML = Array(6).fill(0).map(() => `
                <div class="liquid-glass p-5 rounded-2xl animate-pulse space-y-3">
                    <div class="h-3 bg-white/10 rounded w-1/4"></div>
                    <div class="h-4 bg-white/20 rounded w-5/6"></div>
                    <div class="h-4 bg-white/20 rounded w-3/4"></div>
                    <div class="h-3 bg-white/10 rounded w-1/3 pt-2"></div>
                </div>
            `).join('');

            try {
                const response = await fetch('/api/news');
                const data = await response.json();

                if (!data.success || !data.news || data.news.length === 0) {
                    throw new Error("Unable to parse news feed");
                }

                container.innerHTML = data.news.map(item => `
                    <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="liquid-glass p-5 rounded-2xl flex flex-col justify-between hover:border-sky-500/50 transition-all hover:-translate-y-1 group">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center text-[10px] uppercase tracking-wider text-sky-400 font-bold">
                                <span>${item.publisher}</span>
                                <span class="bg-sky-500/10 px-2 py-0.5 rounded-md text-sky-300">${item.related}</span>
                            </div>
                            <h2 class="text-sm font-bold text-slate-100 group-hover:text-sky-300 transition-colors line-clamp-3">
                                ${item.title}
                            </h2>
                        </div>
                        <div class="mt-4 pt-3 border-t border-white/5 flex justify-between items-center text-[10px] text-slate-400">
                            <span>Read full story ↗</span>
                        </div>
                    </a>
                `).join('');

            } catch (error) {
                container.innerHTML = `
                    <div class="col-span-full py-12 text-center space-y-3">
                        <p class="text-rose-400 font-semibold text-sm">Failed to load live news feed. Please check your server connection.</p>
                        <button onclick="fetchNews()" class="px-4 py-2 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 text-xs font-bold rounded-xl border border-rose-500/20">
                            Try Again
                        </button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
