<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyQuest.AI - Financial Modules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
    <script>
        (function() {
            const savedTheme = localStorage.getItem('mq_theme') || 'dark';
            const savedAccent = localStorage.getItem('mq_accent') || '#38bdf8';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.documentElement.style.setProperty('--accent-color', savedAccent);
        })();
    </script>
</head>
<body class="min-h-screen flex bg-slate-950 text-slate-100">

    <div id="sidebar-container"></div>

    <main class="flex-1 p-6 md:p-8 overflow-y-auto h-screen space-y-6 max-w-7xl mx-auto">
        
        <!-- Header Banner -->
        <div class="flex flex-wrap justify-between items-center border-b border-white/10 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black text-white tracking-tight flex items-center gap-2">
                    🎯 Financial Literacy Modules
                </h1>
                <p class="text-slate-400 text-xs mt-0.5">Master bite-sized financial lessons, complete 10-question quizzes, earn XP, and unlock badges!</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="px-4 py-2 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-400 font-black text-xs flex items-center gap-1.5">
                    <span>🪙</span> <span id="user-coins">0</span> Coins
                </div>
                <div class="px-4 py-2 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-300 font-black text-xs flex items-center gap-1.5">
                    <span>⚡</span> <span id="user-xp">0</span> XP
                </div>
                <div class="px-4 py-2 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 font-black text-xs flex items-center gap-1.5">
                    <span>🏆</span> <span id="user-badges-count">0 / 7</span> Badges
                </div>
            </div>
        </div>

        <!-- Achievements & Badges Panel -->
        <div class="liquid-glass p-5 rounded-2xl space-y-3">
            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">ACHIEVEMENTS & BADGES</h2>
            <div id="badges-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3">
                <!-- Badges render dynamically -->
            </div>
        </div>

        <!-- All 7 Modules Grid -->
        <div id="modules-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Modules render dynamically -->
        </div>

    </main>

    <script src="/static/sidebar.js"></script>
    <script>
        let coins = parseInt(localStorage.getItem('mq_coins')) || 250;
        let xp = parseInt(localStorage.getItem('mq_xp')) || 0;
        let unlockedBadges = JSON.parse(localStorage.getItem('mq_badges')) || [];

        const ALL_BADGES = [
            { id: "b1", name: "Budget Boss", icon: "📊" },
            { id: "b2", name: "Credit Master", icon: "💳" },
            { id: "b3", name: "Market Guru", icon: "📈" },
            { id: "b4", name: "Tax Wizard", icon: "📑" },
            { id: "b5", name: "Crypto Expert", icon: "🪙" },
            { id: "b6", name: "Real Estate Pro", icon: "🏠" },
            { id: "b7", name: "Wealth Titan", icon: "👑" }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderBadges();
            fetchModules();
        });

        function updateStats() {
            document.getElementById('user-coins').innerText = coins;
            document.getElementById('user-xp').innerText = xp;
            document.getElementById('user-badges-count').innerText = `${unlockedBadges.length} / 7`;
        }

        function renderBadges() {
            const container = document.getElementById('badges-grid');
            container.innerHTML = ALL_BADGES.map(b => {
                const isUnlocked = unlockedBadges.includes(b.id);
                return `
                    <div class="p-3 rounded-xl text-center border ${isUnlocked ? 'bg-sky-500/10 border-sky-500/40 text-white' : 'bg-black/20 border-white/5 text-slate-600 opacity-60'}">
                        <span class="text-2xl block mb-1">${b.icon}</span>
                        <span class="text-[10px] font-bold block">${b.name}</span>
                        <span class="text-[9px] uppercase tracking-wider block mt-0.5 ${isUnlocked ? 'text-sky-400 font-extrabold' : 'text-slate-500'}">${isUnlocked ? 'Unlocked' : 'Locked'}</span>
                    </div>
                `;
            }).join('');
        }

        async function fetchModules() {
            const container = document.getElementById('modules-container');
            try {
                const res = await fetch('/api/quiz/modules');
                const data = await res.json();
                if (!data.success) return;

                container.innerHTML = data.modules.map((m, idx) => `
                    <div class="liquid-glass p-6 rounded-2xl flex flex-col justify-between space-y-4">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] uppercase font-extrabold text-sky-400 tracking-wider">Module 0${idx + 1}</span>
                                <span class="text-[10px] font-bold text-slate-400">${m.questions.length} Questions</span>
                            </div>
                            <h3 class="text-base font-bold text-white">${m.title}</h3>
                            <p class="text-xs text-slate-400 line-clamp-3">${m.description}</p>
                        </div>
                        <div class="pt-4 border-t border-white/10 space-y-3">
                            <div class="text-[10px] font-bold text-slate-400 flex justify-between">
                                <span>Reward:</span>
                                <div><span class="text-amber-400">+${m.coin_reward} 🪙</span> | <span class="text-purple-400">+${m.xp_reward} ⚡</span></div>
                            </div>
                            <button onclick="claimModuleReward('${m.badge_id}', ${m.coin_reward}, ${m.xp_reward})" class="w-full liquid-btn-primary py-2 rounded-xl text-xs font-bold">
                                Start Quiz & Complete
                            </button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                container.innerHTML = `<p class="text-xs text-rose-400">Failed to load modules from server.</p>`;
            }
        }

        function claimModuleReward(badgeId, coinReward, xpReward) {
            coins += coinReward;
            xp += xpReward;
            if (!unlockedBadges.includes(badgeId)) {
                unlockedBadges.push(badgeId);
            }

            localStorage.setItem('mq_coins', coins);
            localStorage.setItem('mq_xp', xp);
            localStorage.setItem('mq_badges', JSON.stringify(unlockedBadges));

            updateStats();
            renderBadges();
            alert(`🎉 Quiz Completed! Earned +${coinReward} Coins, +${xpReward} XP, and unlocked a new Badge!`);
        }
    </script>
</body>
</html>
