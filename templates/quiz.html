</head><script>
    (function() {
        const savedTheme = localStorage.getItem('mq_theme') || 'dark';
        const savedAccent = localStorage.getItem('mq_accent') || '#38bdf8';
        
        document.documentElement.setAttribute('data-theme', savedTheme);
        document.documentElement.style.setProperty('--accent-color', savedAccent);
        
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(savedAccent);
        if (result) {
            const r = parseInt(result[1], 16), g = parseInt(result[2], 16), b = parseInt(result[3], 16);
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            document.documentElement.style.setProperty('--accent-text', yiq >= 128 ? '#020617' : '#ffffff');
        }
    })();
</script>

                    { q: "What does a progressive income tax system mean?", options: ["Everyone pays the exact same tax percentage", "Higher income increments are taxed at progressively higher rates", "Taxes decrease as you earn more", "Only corporations pay tax"], answer: 1, explanation: "Progressive tax systems apply higher rates only to higher bands of taxable income." },
                    { q: "Which form do traditional W-2 employees receive at year-end summarizing annual wages and taxes withheld?", options: ["Form W-2", "Form 1099-MISC", "Form 1040-EZ", "Form W-4"], answer: 0, explanation: "W-2 forms detail wages earned and taxes withheld throughout the calendar year." },
                    { q: "What is the standard deduction?", options: ["A penalty fee charged by the IRS", "A flat dollar amount that reduces your taxable income automatically", "A tax on luxury items", "A refund check"], answer: 1, explanation: "The standard deduction lowers taxable income without requiring itemized receipt tracking." },
                    { q: "How does a Roth IRA differ from a Traditional IRA?", options: ["Roth contributions are tax-deductible upfront", "Roth IRA contributions are made with post-tax dollars and grow 100% tax-free in retirement", "Roth IRAs are only for businesses", "Traditional IRAs never tax withdrawals"], answer: 1, explanation: "Roth IRAs offer tax-free withdrawals in retirement because contributions are made post-tax." },
                    { q: "What is a 401(k) employer match?", options: ["A tax penalty", "Free money contributed by your employer matching a percentage of your salary contributions", "A loan from the government", "A health insurance discount"], answer: 1, explanation: "Employer matches provide 100% immediate return on matched contributions—always take full advantage!" },
                    { q: "1099 Independent Contractors are responsible for paying:", options: ["No taxes at all", "Self-employment tax (Medicare + Social Security)", "Only state sales tax", "Property taxes"], answer: 1, explanation: "Contractors must cover both employee and employer portions of Medicare and Social Security." },
                    { q: "What is gross income?", options: ["Income after all taxes are deducted", "Total income earned before any taxes or deductions are subtracted", "Income spent on wants", "Savings yield"], answer: 1, explanation: "Gross income is your total headline earnings prior to deductions." },
                    { q: "What is net income?", options: ["Take-home pay remaining after taxes and deductions", "Total income before taxes", "Investment profits only", "Gross sales revenue"], answer: 0, explanation: "Net income represents your actual spendable take-home pay." },
                    { q: "Contributions to a Traditional 401(k) reduce your:", options: ["Credit utilization", "Current year taxable income", "FICO score", "Gross income"], answer: 1, explanation: "Traditional 401(k) dollars are pre-tax, lowering taxable income in the year contributed." },
                    { q: "When is the deadline for filing individual US federal income tax returns usually?", options: ["January 1st", "April 15th", "July 4th", "December 31st"], answer: 1, explanation: "April 15th is the standard annual federal tax return filing deadline." }
                ]
            }
        ];

        // State Management
        let userXP = parseInt(localStorage.getItem('mq_xp'), 10) || 0;
        let unlockedBadges = [];
        try {
            const savedBadges = JSON.parse(localStorage.getItem('mq_badges') || '[]');
            unlockedBadges = Array.isArray(savedBadges) ? savedBadges : [];
        } catch (error) {
            localStorage.removeItem('mq_badges');
        }
        let activeModule = null;
        let userAnswers = {};

        document.addEventListener("DOMContentLoaded", () => {
            updateStatsUI();
            renderBadges();
            renderModulesGrid();
        });

        function updateStatsUI() {
            document.getElementById('user-xp').innerText = `${userXP} XP`;
            document.getElementById('unlocked-badge-count').innerText = `${unlockedBadges.length} / ${modulesData.length}`;
            localStorage.setItem('mq_xp', userXP);
            localStorage.setItem('mq_badges', JSON.stringify(unlockedBadges));
        }

        function renderBadges() {
            const container = document.getElementById('badges-container');
            container.innerHTML = modulesData.map(mod => {
                const isUnlocked = unlockedBadges.includes(mod.badge);
                return `
                    <div class="p-3 rounded-xl border transition text-center ${isUnlocked ? 'bg-emerald-500/10 border-emerald-400/30 text-emerald-300' : 'bg-black/30 border-white/5 text-slate-600 opacity-60'}">
                        <div class="text-2xl mb-1">${mod.icon}</div>
                        <div class="text-[10px] font-black uppercase tracking-wider">${mod.badge}</div>
                        <div class="text-[9px] mt-0.5">${isUnlocked ? 'Unlocked' : 'Locked'}</div>
                    </div>
                `;
            }).join('');
        }

        function renderModulesGrid() {
            const container = document.getElementById('main-content-area');
            container.innerHTML = `
                <div id="modules-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    ${modulesData.map(mod => {
                        const isUnlocked = unlockedBadges.includes(mod.badge);
                        return `
                            <div class="liquid-glass p-6 rounded-2xl flex flex-col justify-between space-y-4 hover:border-sky-400/40 transition group">
                                <div class="space-y-3">
                                    <div class="flex justify-between items-center">
                                        <span class="text-3xl">${mod.icon}</span>
                                        <span class="px-2.5 py-1 rounded-md text-[10px] font-extrabold uppercase ${isUnlocked ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-400/30' : 'bg-sky-500/10 text-sky-400 border border-sky-400/20'}">
                                            ${isUnlocked ? 'Completed' : '10 Qs Quiz'}
                                        </span>
                                    </div>
                                    <h3 class="text-lg font-black text-white group-hover:text-sky-300 transition">${mod.title}</h3>
                                    <p class="text-xs text-slate-400 leading-relaxed">${mod.description}</p>
                                </div>
                                <button onclick="openLesson('${mod.id}')" class="w-full liquid-btn-primary py-2.5 rounded-xl text-xs font-bold uppercase tracking-wider">
                                    Start Lesson & Quiz →
                                </button>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        function openLesson(moduleId) {
            activeModule = modulesData.find(m => m.id === moduleId);
            const container = document.getElementById('main-content-area');

            container.innerHTML = `
                <div class="liquid-glass p-6 md:p-8 rounded-2xl space-y-6 max-w-4xl mx-auto">
                    <div class="flex justify-between items-center border-b border-white/10 pb-4">
                        <div class="flex items-center gap-3">
                            <span class="text-3xl">${activeModule.icon}</span>
                            <div>
                                <h2 class="text-xl font-black text-white">${activeModule.title}</h2>
                                <span class="text-xs text-sky-400 font-bold uppercase">In-Depth Reading Lesson</span>
                            </div>
                        </div>
                        <button onclick="renderModulesGrid()" class="px-3 py-1.5 rounded-lg bg-white/10 text-xs font-bold hover:bg-white/20">
                            ← Back to Modules
                        </button>
                    </div>

                    <div class="prose prose-invert max-w-none text-slate-200 leading-relaxed space-y-4">
                        ${activeModule.lesson}
                    </div>

                    <div class="pt-6 border-t border-white/10 flex justify-end">
                        <button onclick="startQuiz()" class="liquid-btn-primary px-6 py-3 rounded-xl text-xs font-black uppercase tracking-wider">
                            Take 10-Question Quiz (+100 XP) →
                        </button>
                    </div>
                </div>
            `;
        }

        function startQuiz() {
            userAnswers = {};
            renderQuizView();
        }

        function renderQuizView() {
            const container = document.getElementById('main-content-area');
            container.innerHTML = `
                <div class="liquid-glass p-6 md:p-8 rounded-2xl space-y-6 max-w-4xl mx-auto">
                    <div class="flex justify-between items-center border-b border-white/10 pb-4">
                        <div>
                            <h2 class="text-xl font-black text-white">${activeModule.title} Quiz</h2>
                            <p class="text-xs text-slate-400">Answer all 10 questions to earn 100 XP and unlock the ${activeModule.badge} badge!</p>
                        </div>
                        <button onclick="openLesson('${activeModule.id}')" class="px-3 py-1.5 rounded-lg bg-white/10 text-xs font-bold hover:bg-white/20">
                            📖 Review Lesson
                        </button>
                    </div>

                    <form id="quiz-form" class="space-y-6">
                        ${activeModule.questions.map((q, qIndex) => `
                            <div class="p-4 rounded-xl bg-black/30 border border-white/5 space-y-3">
                                <p class="text-sm font-bold text-white">${qIndex + 1}. ${q.q}</p>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                    ${q.options.map((opt, oIndex) => `
                                        <label class="flex items-center gap-2 p-3 rounded-lg bg-white/5 hover:bg-sky-500/10 border border-white/5 cursor-pointer text-xs font-semibold text-slate-300 transition">
                                            <input type="radio" name="q_${qIndex}" value="${oIndex}" onchange="recordAnswer(${qIndex}, ${oIndex})" class="accent-sky-400">
                                            <span>${opt}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}

                        <div class="pt-4 flex justify-end">
                            <button type="button" onclick="submitQuiz()" class="liquid-btn-primary px-8 py-3 rounded-xl text-xs font-black uppercase tracking-wider">
                                Submit Quiz Answers
                            </button>
                        </div>
                    </form>
                </div>
            `;
        }

        function recordAnswer(qIndex, oIndex) {
            userAnswers[qIndex] = oIndex;
        }

        function submitQuiz() {
            if (Object.keys(userAnswers).length < activeModule.questions.length) {
                alert("Please answer all 10 questions before submitting!");
                return;
            }

            let correctCount = 0;
            const feedbackList = activeModule.questions.map((q, idx) => {
                const userSelected = userAnswers[idx];
                const isCorrect = userSelected === q.answer;
                if (isCorrect) correctCount++;

                return `
                    <div class="p-4 rounded-xl border ${isCorrect ? 'bg-emerald-500/10 border-emerald-400/30' : 'bg-rose-500/10 border-rose-400/30'} space-y-2">
                        <div class="flex justify-between text-xs font-bold">
                            <span class="text-white">${idx + 1}. ${q.q}</span>
                            <span class="${isCorrect ? 'text-emerald-400' : 'text-rose-400'}">${isCorrect ? '✓ Correct' : '✗ Incorrect'}</span>
                        </div>
                        <p class="text-xs text-slate-300"><strong>Your Answer:</strong> ${q.options[userSelected]}</p>
                        ${!isCorrect ? `<p class="text-xs text-emerald-400"><strong>Correct Answer:</strong> ${q.options[q.answer]}</p>` : ''}
                        <div class="p-2.5 rounded-lg bg-black/40 text-[11px] text-slate-300 leading-relaxed border border-white/5">
                            💡 <strong>Explanation:</strong> ${q.explanation}
                        </div>
                    </div>
                `;
            }).join('');

            const passed = correctCount >= 7; // 70% pass score
            if (passed) {
                userXP += 100;
                if (!unlockedBadges.includes(activeModule.badge)) {
                    unlockedBadges.push(activeModule.badge);
                }
                updateStatsUI();
                renderBadges();
            }

            const container = document.getElementById('main-content-area');
            container.innerHTML = `
                <div class="liquid-glass p-6 md:p-8 rounded-2xl space-y-6 max-w-4xl mx-auto">
                    <div class="text-center space-y-2 border-b border-white/10 pb-6">
                        <div class="text-4xl">${passed ? '🎉' : '💪'}</div>
                        <h2 class="text-2xl font-black text-white">${passed ? 'Quiz Passed!' : 'Keep Practicing!'}</h2>
                        <p class="text-sm font-bold ${passed ? 'text-emerald-400' : 'text-rose-400'}">
                            You scored ${correctCount} / 10 (${correctCount * 10}%). ${passed ? '+100 XP Earned & Badge Unlocked!' : 'Score 70% or higher to earn XP and unlock the badge.'}
                        </p>
                    </div>

                    <div class="space-y-4">
                        <h3 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Detailed Explanations & Review</h3>
                        ${feedbackList}
                    </div>

                    <div class="pt-6 border-t border-white/10 flex flex-wrap justify-between gap-4">
                        <button onclick="renderModulesGrid()" class="px-5 py-2.5 rounded-xl bg-white/10 text-xs font-bold hover:bg-white/20">
                            ← Back to Modules
                        </button>
                        <button onclick="startQuiz()" class="liquid-btn-primary px-6 py-2.5 rounded-xl text-xs font-black uppercase tracking-wider">
                            🔄 Retry Quiz
                        </button>
                    </div>
                </div>
            `;
        }
    </script>
</body>
</html>
