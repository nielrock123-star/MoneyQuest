<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyQuest.AI - Financial Literacy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="min-h-screen flex bg-slate-950 text-slate-100">
    <div id="sidebar-container"></div>
    <main class="flex-1 p-6 md:p-8 overflow-y-auto min-h-screen space-y-6 max-w-7xl mx-auto">
        <header class="flex flex-wrap justify-between items-center border-b border-white/10 pb-4 gap-4">
            <div>
                <h1 class="text-2xl font-black text-white">🎯 Financial Literacy Modules</h1>
                <p class="text-slate-400 text-xs mt-1">Read each lesson, pass its quiz, and earn coins and XP.</p>
            </div>
            <div class="flex gap-2 text-xs font-black">
                <span class="px-3 py-2 rounded-xl bg-amber-500/10 text-amber-400">🪙 <b id="user-coins">250</b></span>
                <span class="px-3 py-2 rounded-xl bg-sky-500/10 text-sky-400">⚡ <b id="user-xp">0</b></span>
                <span class="px-3 py-2 rounded-xl bg-emerald-500/10 text-emerald-400">🏆 <b id="user-badges-count">0 / 7</b></span>
            </div>
        </header>
        <section class="liquid-glass p-5 rounded-2xl space-y-3">
            <h2 class="text-xs font-extrabold uppercase tracking-wider text-slate-400">Achievements & Badges</h2>
            <div id="badges-grid" class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-7 gap-3"></div>
        </section>
        <section id="modules-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>
    </main>
    <script src="/static/sidebar.js"></script>
    <script>
        let coins = parseInt(localStorage.getItem('mq_coins'), 10) || 250;
        let xp = parseInt(localStorage.getItem('mq_xp'), 10) || 0;
        let unlockedBadges = [];
        let completedModules = [];
        let activeModule = null;
        let answers = {};
        try {
            const saved = JSON.parse(localStorage.getItem('mq_badges') || '[]');
            unlockedBadges = Array.isArray(saved) ? saved : [];
            const done = JSON.parse(localStorage.getItem('mq_completed_modules') || '[]');
            completedModules = Array.isArray(done) ? done : [];
        } catch (error) {
            localStorage.removeItem('mq_badges');
            localStorage.removeItem('mq_completed_modules');
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateStats();
            renderBadges();
            fetchModules();
        });

        function updateStats() {
            document.getElementById('user-coins').innerText = coins;
            document.getElementById('user-xp').innerText = xp;
            document.getElementById('user-badges-count').innerText = `${unlockedBadges.length} / 7`;
            localStorage.setItem('mq_coins', coins);
            localStorage.setItem('mq_xp', xp);
        }

        function renderBadges() {
            const names = ['Budget Boss', 'Credit Master', 'Market Guru', 'Tax Wizard', 'Crypto Expert', 'Real Estate Pro', 'Wealth Titan'];
            const icons = ['📊', '💳', '📈', '📑', '🪙', '🏠', '👑'];
            document.getElementById('badges-grid').innerHTML = names.map((name, index) => {
                const unlocked = unlockedBadges.includes(`b${index + 1}`);
                return `<div class="p-3 rounded-xl text-center border ${unlocked ? 'bg-emerald-500/10 border-emerald-400/30' : 'bg-black/20 border-white/5 opacity-60'}"><span class="text-2xl block">${icons[index]}</span><span class="text-[10px] font-bold block">${name}</span><span class="text-[9px] uppercase ${unlocked ? 'text-emerald-400' : 'text-slate-500'}">${unlocked ? 'Unlocked' : 'Locked'}</span></div>`;
            }).join('');
        }

        async function fetchModules() {
            const container = document.getElementById('modules-container');
            try {
                const response = await fetch('/api/quiz/modules');
                const data = await response.json();
                if (!response.ok || !data.success || !Array.isArray(data.modules)) {
                    throw new Error(data.message || 'Unable to load modules');
                }
                renderModules(data.modules);
            } catch (error) {
                container.innerHTML = `<div class="liquid-glass p-8 rounded-2xl text-center md:col-span-2 lg:col-span-3"><h2 class="text-lg font-black text-white">Modules unavailable</h2><p class="text-sm text-slate-400 mt-2">${error.message}</p><button onclick="fetchModules()" class="liquid-btn-primary px-5 py-3 rounded-xl text-xs font-bold mt-5">Retry</button></div>`;
            }
        }

        function renderModules(modules) {
            document.getElementById('modules-container').innerHTML = modules.map((module, index) => `
                <article class="liquid-glass p-6 rounded-2xl flex flex-col justify-between gap-5">
                    <div class="space-y-3"><div class="flex justify-between"><span class="text-[10px] uppercase font-extrabold text-sky-400">Module 0${index + 1}</span><span class="text-[10px] text-slate-400">${module.questions.length} MCQs</span></div><h2 class="text-lg font-black text-white">${module.title}</h2><p class="text-xs text-slate-400">${module.description}</p></div>
                    <button onclick="openLesson('${module.id}')" class="w-full liquid-btn-primary py-2.5 rounded-xl text-xs font-bold">${completedModules.includes(module.id) ? 'Review Lesson' : 'Open Lesson'} →</button>
                </article>`).join('');
        }

        async function openLesson(moduleId) {
            const response = await fetch('/api/quiz/modules');
            const data = await response.json();
            activeModule = data.modules.find(module => module.id === moduleId);
            document.getElementById('modules-container').innerHTML = `<div class="liquid-glass p-6 md:p-8 rounded-2xl space-y-6 md:col-span-2 lg:col-span-3"><div class="flex flex-wrap justify-between gap-3"><div><span class="text-xs font-bold uppercase text-sky-400">Lesson</span><h2 class="text-2xl font-black text-white">${activeModule.title}</h2></div><button onclick="fetchModules()" class="px-3 py-2 rounded-lg bg-white/10 text-xs font-bold">← All Modules</button></div><p class="text-sm leading-7 text-slate-300">${activeModule.lesson}</p><div class="border-t border-white/10 pt-5 flex justify-end"><button onclick="startQuiz()" class="liquid-btn-primary px-5 py-3 rounded-xl text-xs font-black">Take ${activeModule.questions.length}-Question Quiz →</button></div></div>`;
        }

        function startQuiz() {
            answers = {};
            document.getElementById('modules-container').innerHTML = `<div class="liquid-glass p-6 md:p-8 rounded-2xl space-y-6 md:col-span-2 lg:col-span-3"><div class="flex justify-between gap-3 border-b border-white/10 pb-4"><div><span class="text-xs font-bold uppercase text-sky-400">Quiz</span><h2 class="text-xl font-black text-white">${activeModule.title}</h2></div><button onclick="openLesson('${activeModule.id}')" class="px-3 py-2 rounded-lg bg-white/10 text-xs font-bold">Review Lesson</button></div><div class="space-y-5">${activeModule.questions.map((question, index) => `<fieldset class="p-4 rounded-xl bg-black/20 border border-white/5"><legend class="text-sm font-bold text-white mb-3">${index + 1}. ${question.q}</legend><div class="grid sm:grid-cols-2 gap-2">${question.options.map((option, optionIndex) => `<label class="flex gap-2 p-3 rounded-lg bg-white/5 text-xs cursor-pointer"><input type="radio" name="q${index}" onchange="answers[${index}]=${optionIndex}"><span>${option}</span></label>`).join('')}</div></fieldset>`).join('')}</div><button onclick="submitQuiz()" class="liquid-btn-primary w-full py-3 rounded-xl text-xs font-black">Submit Answers</button></div>`;
        }

        function submitQuiz() {
            if (Object.keys(answers).length !== activeModule.questions.length) { alert('Please answer every question first.'); return; }
            const score = activeModule.questions.reduce((total, question, index) => total + (answers[index] === question.answer ? 1 : 0), 0);
            const passed = score >= Math.ceil(activeModule.questions.length * 0.7);
            let reward = '';
            if (passed && !completedModules.includes(activeModule.id)) {
                coins += activeModule.coin_reward;
                xp += activeModule.xp_reward;
                unlockedBadges.push(activeModule.badge_id);
                completedModules.push(activeModule.id);
                localStorage.setItem('mq_badges', JSON.stringify(unlockedBadges));
                localStorage.setItem('mq_completed_modules', JSON.stringify(completedModules));
                updateStats(); renderBadges();
                reward = ` You earned +${activeModule.coin_reward} coins and +${activeModule.xp_reward} XP.`;
            }
            document.getElementById('modules-container').innerHTML = `<div class="liquid-glass p-8 rounded-2xl space-y-5 md:col-span-2 lg:col-span-3"><h2 class="text-2xl font-black text-white">${passed ? '🎉 Quiz Passed!' : 'Keep Practicing'}</h2><p class="text-sm text-slate-300">You scored ${score} / ${activeModule.questions.length}.${reward}</p><div class="space-y-3">${activeModule.questions.map((question, index) => `<div class="p-3 rounded-xl ${answers[index] === question.answer ? 'bg-emerald-500/10' : 'bg-rose-500/10'} text-xs"><b>${index + 1}. ${answers[index] === question.answer ? 'Correct' : 'Review'}</b> <span class="text-slate-300">${question.explanation}</span></div>`).join('')}</div><button onclick="fetchModules()" class="liquid-btn-primary px-5 py-3 rounded-xl text-xs font-bold">Back to Modules</button></div>`;
        }
    </script>
</body>
</html>
